<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" width="1200" height="970" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif">
  <title>图1 概念框架：县城与大城市的财政分轨</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .h { font-size: 20px; font-weight: 700; fill: #222; }
      .t { font-size: 15px; fill: #222; }
      .m { font-size: 14px; fill: #222; }
      .s { font-size: 12.5px; fill: #555; }
      .ax { font-size: 15px; font-weight: 700; fill: #333; }
      .tag { font-size: 14px; font-weight: 700; fill: #8a6100; }
      .box { stroke-width: 1.4; rx: 8; }
      .ln { stroke: #555; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
      .both { stroke: #777; stroke-width: 1.4; fill: none; marker-start: url(#ar); marker-end: url(#ar); }
      .dash { stroke: #999; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#ar); }
      .todo { stroke: #b8860b; stroke-width: 1.4; stroke-dasharray: 6 4; rx: 8; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="970" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="600" y="38" text-anchor="middle" class="h">县城与大城市的财政分轨（fiscal dual track）</text>
  <text x="600" y="63" text-anchor="middle" class="s">四条连续投入轴界定两种供给体制；人口流动决定人均指标的分母；结果一侧全部待检验</text>

  <!-- 列标题 -->
  <rect x="40" y="86" width="440" height="36" fill="#dbe8f4" stroke="#2166ac" class="box"/>
  <text x="260" y="110" text-anchor="middle" class="t" font-weight="700">县城体制（县、县级市的县城）</text>
  <text x="600" y="110" text-anchor="middle" class="s">投入轴（连续变量）</text>
  <rect x="720" y="86" width="440" height="36" fill="#f6ddd8" stroke="#b2182b" class="box"/>
  <text x="940" y="110" text-anchor="middle" class="t" font-weight="700">大城市体制（大城市市辖区）</text>

  <!-- 轴 1 财政水平 -->
  <rect x="40" y="136" width="440" height="62" fill="#f3f8fc" stroke="#2166ac" class="box"/>
  <text x="58" y="162" class="t">人均净流入高，人均本级收入低</text>
  <text x="58" y="185" class="s">外来资金以上级转移支付为主（分母为 2010 年常住人口）</text>
  <text x="600" y="160" text-anchor="middle" class="ax">① 财政水平</text>
  <path d="M512,180 L688,180" class="both"/>
  <rect x="720" y="136" width="440" height="62" fill="#fdf4f2" stroke="#b2182b" class="box"/>
  <text x="738" y="162" class="t">人均本级收入高，人均净流入低</text>
  <text x="738" y="185" class="s">本级税收为主，净流入少或为负</text>

  <!-- 轴 2 住房市场化与压力 -->
  <rect x="40" y="210" width="440" height="62" fill="#f3f8fc" stroke="#2166ac" class="box"/>
  <text x="58" y="236" class="t">自建与自有住房为主，人均住房面积大</text>
  <text x="58" y="259" class="s">市场租赁、商品房与集体户比例低</text>
  <text x="600" y="234" text-anchor="middle" class="ax">② 住房市场化与压力</text>
  <path d="M512,254 L688,254" class="both"/>
  <rect x="720" y="210" width="440" height="62" fill="#fdf4f2" stroke="#b2182b" class="box"/>
  <text x="738" y="236" class="t">市场租赁、商品房与集体户比例高</text>
  <text x="738" y="259" class="s">人均住房建筑面积小</text>

  <!-- 轴 3 土地与债务 -->
  <rect x="40" y="284" width="440" height="62" fill="#f3f8fc" stroke="#2166ac" class="box"/>
  <text x="58" y="310" class="t">土地出让规模小</text>
  <text x="58" y="333" class="s">城投债务与专项债的比重不预设，是待测量的问题</text>
  <text x="600" y="308" text-anchor="middle" class="ax">③ 土地与债务</text>
  <path d="M512,328 L688,328" class="both"/>
  <rect x="720" y="284" width="440" height="62" fill="#fdf4f2" stroke="#b2182b" class="box"/>
  <text x="738" y="310" class="t">土地出让、土地抵押与城投债务密集</text>
  <text x="738" y="333" class="s">土地金融化（land financialisation）</text>

  <!-- 轴 4 国家中心性 -->
  <rect x="40" y="358" width="440" height="62" fill="#f3f8fc" stroke="#2166ac" class="box"/>
  <text x="58" y="384" class="t">行政等级低（县与县级市）</text>
  <text x="58" y="407" class="s">开发区核准面积与中心建成区之比低</text>
  <text x="600" y="382" text-anchor="middle" class="ax">④ 国家中心性</text>
  <path d="M512,402 L688,402" class="both"/>
  <rect x="720" y="358" width="440" height="62" fill="#fdf4f2" stroke="#b2182b" class="box"/>
  <text x="738" y="384" class="t">行政等级高，国家级开发区集中</text>
  <text x="738" y="407" class="s">国家企业家主义（state entrepreneurialism）</text>

  <!-- 人口流动（分母） -->
  <rect x="40" y="440" width="440" height="56" fill="#eaf1f8" stroke="#2166ac" class="box"/>
  <text x="58" y="464" class="t">常住人口流出，常住人口少于户籍人口</text>
  <text x="58" y="485" class="s">人口是分母，县域与县城的人口变化可以不同</text>
  <path d="M512,458 L688,458" class="ln"/>
  <text x="600" y="451" text-anchor="middle" class="s">人口流动（户籍留在原籍）</text>
  <path d="M688,484 L512,484" class="dash"/>
  <text x="600" y="501" text-anchor="middle" class="s">经中央、省两级再分配</text>
  <rect x="720" y="440" width="440" height="56" fill="#fbeae6" stroke="#b2182b" class="box"/>
  <text x="738" y="464" class="t">常住人口流入，常住人口多于户籍人口</text>
  <text x="738" y="485" class="s">公共品按户籍配置，非户籍人口进入受限</text>

  <!-- 投入到机制 -->
  <path d="M260,498 L260,520" class="ln"/>
  <path d="M940,498 L940,520" class="ln"/>

  <!-- 机制 -->
  <rect x="40" y="522" width="1120" height="64" fill="#f2f2f2" stroke="#777" class="box"/>
  <text x="60" y="548" class="t" font-weight="700">机制</text>
  <text x="112" y="548" class="t">分母效应　｜　项目化供给　｜　社会基础设施　｜　市场替代与资本化　｜　维护负担</text>
  <text x="112" y="572" class="s">每个机制对应可观测的指标（见第 3 节）；社会基础设施指学校、医院与养老设施</text>

  <!-- 机制到结果 -->
  <path d="M260,588 L260,610" class="ln"/>
  <path d="M940,588 L940,610" class="ln"/>

  <!-- 结果（待检验） -->
  <rect x="40" y="612" width="540" height="104" fill="#fffdf5" class="todo"/>
  <text x="58" y="637" class="tag">预期结果（待检验）</text>
  <text x="58" y="661" class="m">人均树木、大型树木斑块与建成面积较高？（H2、H3）</text>
  <text x="58" y="683" class="m">住房余量比大于 1，扩张与人口下降并存？（H4）</text>
  <text x="58" y="705" class="m">每千常住人口的床位与学位较高？绿地资本化弱？（H6、H7）</text>
  <rect x="620" y="612" width="540" height="104" fill="#fffdf5" class="todo"/>
  <text x="638" y="637" class="tag">预期结果（待检验）</text>
  <text x="638" y="661" class="m">公共绿地被流入人口稀释，租赁与集体户多、住房拥挤？（H5）</text>
  <text x="638" y="683" class="m">每千常住人口的床位与学位偏低？（H7）</text>
  <text x="638" y="705" class="m">绿地被房价资本化，街道人口置换？（H6、H6a）</text>

  <!-- 测度 -->
  <rect x="40" y="736" width="1120" height="104" fill="#f7f7f7" stroke="#777" class="box"/>
  <text x="60" y="761" class="t" font-weight="700">测度（2020 年边界，约 2 200 个分析单元；财政 2017～2019 年，普查 2000、2010、2020 年）</text>
  <text x="60" y="785" class="m"><tspan font-weight="700">财政与土地</tspan>　人均净流入、人均本级收入、2009 年观测转移支付、土地出让、城投债务、专项债、开发区</text>
  <text x="60" y="807" class="m"><tspan font-weight="700">普查与住建部</tspan>　常住与户籍人口、住房来源、集体户；公园、道路与市政投资资金来源；学位与床位</text>
  <text x="60" y="829" class="m"><tspan font-weight="700">遥感（GEE）</tspan>　GHSL 建成与体量、WorldCover 树木、Hansen 2000 年基期、GAIA 不透水面、GHS-SMOD、VIIRS 夜光（辅助）</text>

  <!-- 识别 -->
  <rect x="40" y="856" width="1120" height="96" fill="#fffbea" stroke="#b8860b" class="box"/>
  <text x="60" y="882" class="t" font-weight="700">识别　让财政水平发生外生变化</text>
  <text x="60" y="908" class="m">省直管县财政改革的分批推进（主设计，Callaway–Sant'Anna 估计量）</text>
  <text x="60" y="932" class="m">撤县设区（行政身份的简化式效应）；连片特困地区边界县对；长差分以 1999～2001 年财政结构为处理变量</text>
</svg>
